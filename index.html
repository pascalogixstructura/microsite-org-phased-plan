<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pascalogix Structura | Atomic TODO Notebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #fff; color: #111; font-family: 'Inter', sans-serif; }
        .red-accent { color: #d32f2f; }
        .bg-planner { background: #f9fafb; }
        .task-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 2px; padding: 0.5rem; cursor: grab; transition: 0.2s; margin-bottom: 0.25rem; font-size: 0.8rem; user-select: none; touch-action: none; }
        .task-card:hover { border-color: #111; background: #f9fafb; }
        .task-card.selected { border: 2px solid #d32f2f; background: #fff5f5; }
        .task-card.dragging { opacity: 0.5; }
        .planner-slot { background: #fff; border: 1px dashed #cbd5e1; border-radius: 2px; min-height: 60px; margin-bottom: 0.25rem; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0.5rem; color: #9ca3af; font-size: 0.75rem; transition: 0.2s; cursor: pointer; position: relative; }
        .planner-slot:hover { border-color: #d32f2f; background: #fff5f5; }
        .planner-slot.filled { border: 1px solid #111; background: #fff; color: #111; justify-content: flex-start; text-align: left; cursor: default; }
        .planner-slot.drag-over { border-color: #d32f2f; background: #ffe5e5; }
        .remove-btn { position: absolute; top: 4px; right: 4px; color: #d32f2f; cursor: pointer; font-size: 1.5rem; line-height: 1; padding: 0.4rem; background: #fff; border: 1px solid #d32f2f; border-radius: 2px; z-index: 5; }
        .remove-btn:hover { background: #d32f2f; color: #fff; }
        .total-bar { background: #111; color: #fff; padding: 0.75rem; text-align: center; font-size: 1rem; font-weight: bold; margin-top: 0.5rem; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 0.5rem; }
        .total-bar .red-accent { color: #fff; }
        .col-header { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #111; border-bottom: 2px solid #111; padding-bottom: 0.25rem; margin-bottom: 0.5rem; font-weight: bold; text-align: center; }
        .date-input { font-size: 0.7rem; border: 1px solid #ccc; padding: 2px 4px; border-radius: 2px; margin-top: 4px; width: 45%; float: right; margin-left: 10px; }
        .phase-detail { background: #e2e8f0; border: 1px solid #e5e7eb; padding: 1rem; margin-top: 1rem; }
        .static-plan-header { font-size: 1.5rem; font-weight: 800; text-transform: uppercase; border-bottom: 2px solid #111; padding-bottom: 1rem; margin-bottom: 2rem; }
        .phase-block { border-left: 4px solid #d32f2f; padding-left: 1.5rem; margin-bottom: 2.5rem; }
        .phase-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem; }
        .add-task-form { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .add-task-form input[type="text"] { flex: 1; min-width: 150px; padding: 0.4rem 0.6rem; border: 1px solid #ccc; border-radius: 2px; font-size: 0.8rem; }
        .add-task-form button { background: #111; color: #fff; border: none; padding: 0.4rem 1rem; border-radius: 2px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        .add-task-form button:hover { background: #d32f2f; }
        @media (max-width: 640px) { .total-bar { flex-direction: column; align-items: center; } .date-input { width: 100%; float: none; margin-left: 0; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="shrink-0 border-b border-black py-3 bg-white z-10">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="assets/logo.png" alt="Pascalogix Insignia" class="w-12 md:w-24">
                <span class="text-xl font-bold">Pascalogix Structura</span>
            </div>
            <div>
                <input type="date" id="filterDate" class="date-input" />
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl mx-auto px-4 py-4 w-full">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <section>
                <h2 class="col-header">📓 Notebook</h2>
                <div class="add-task-form">
                    <input type="text" id="newTaskInput" placeholder="Write a new task..." />
                    <button id="addTaskBtn">Add Task</button>
                </div>
                <div id="taskList" class="space-y-1"></div>
            </section>
            <section>
                <h2 class="col-header">📅 Weekly Planner</h2>
                <div class="grid grid-cols-1 gap-1">
                    <div class="planner-slot" data-day="monday">Monday</div>
                    <div class="planner-slot" data-day="tuesday">Tuesday</div>
                    <div class="planner-slot" data-day="wednesday">Wednesday</div>
                    <div class="planner-slot" data-day="thursday">Thursday</div>
                    <div class="planner-slot" data-day="friday">Friday</div>
                    <div class="planner-slot" data-day="saturday">Saturday</div>
                    <div class="planner-slot" data-day="sunday">Sunday</div>
                </div>
            </section>
        </div>

        <div class="total-bar">
            <span>Total: <span id="totalCount">0</span></span>
            <span>Completed: <span id="completedCount">0</span></span>
            <span>Pending: <span id="pendingCount">0</span></span>
        </div>

        <div class="phase-detail mt-6">
            <h3 class="static-plan-header">Static Plan</h3>
            <div class="phase-block">
                <div class="phase-title">Phase 1</div>
                <p>Define core tasks and atomic units.</p>
            </div>
            <div class="phase-block">
                <div class="phase-title">Phase 2</div>
                <p>Schedule and track progress.</p>
            </div>
        </div>
    </main>

    <script>
        let tasks = [];
        let selectedTaskId = null;
        const STORAGE_KEY = 'pascalogix_tasks';
        let dragData = null;

        function loadTasks() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try { tasks = JSON.parse(stored); } catch(e) { tasks = []; }
            } else {
                tasks = [
                    { id: 1, text: 'Design logo', completed: false, day: null },
                    { id: 2, text: 'Build HTML structure', completed: false, day: null },
                    { id: 3, text: 'Add drag & drop', completed: false, day: null },
                ];
            }
            tasks.forEach(t => { if (!t.id) t.id = Date.now() + Math.random(); });
            renderAll();
        }

        function saveTasks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        }

        function renderAll() {
            renderTaskList();
            renderPlannerSlots();
            updateTotals();
            saveTasks();
        }

        function renderTaskList() {
            const list = document.getElementById('taskList');
            const filterDate = document.getElementById('filterDate').value;
            let filtered = tasks;
            if (filterDate) {
                filtered = tasks.filter(t => !t.day || t.day === filterDate);
            }
            list.innerHTML = '';
            filtered.forEach(task => {
                const div = document.createElement('div');
                div.className = `task-card ${task.id === selectedTaskId ? 'selected' : ''}`;
                div.textContent = task.text;
                div.draggable = true;
                div.dataset.taskId = task.id;
                div.addEventListener('click', () => {
                    selectedTaskId = task.id;
                    renderAll();
                });
                // Desktop drag
                div.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', task.id);
                    div.classList.add('dragging');
                });
                div.addEventListener('dragend', () => {
                    div.classList.remove('dragging');
                });
                // Mobile touch drag
                div.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    dragData = {
                        taskId: task.id,
                        startX: touch.clientX,
                        startY: touch.clientY,
                        element: div
                    };
                    div.classList.add('dragging');
                }, { passive: true });
                div.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    if (!dragData) return;
                    dragData.element.style.position = 'fixed';
                    dragData.element.style.left = (touch.clientX - 30) + 'px';
                    dragData.element.style.top = (touch.clientY - 30) + 'px';
                    dragData.element.style.zIndex = 1000;
                    dragData.element.style.opacity = 0.7;
                    const slots = document.querySelectorAll('.planner-slot');
                    slots.forEach(slot => {
                        const rect = slot.getBoundingClientRect();
                        if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                            touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                            slot.classList.add('drag-over');
                        } else {
                            slot.classList.remove('drag-over');
                        }
                    });
                }, { passive: false });
                div.addEventListener('touchend', (e) => {
                    if (!dragData) return;
                    const touch = e.changedTouches[0];
                    const slots = document.querySelectorAll('.planner-slot');
                    let targetSlot = null;
                    slots.forEach(slot => {
                        const rect = slot.getBoundingClientRect();
                        if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
                            touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                            targetSlot = slot;
                        }
                        slot.classList.remove('drag-over');
                    });
                    const el = dragData.element;
                    el.style.position = '';
                    el.style.left = '';
                    el.style.top = '';
                    el.style.zIndex = '';
                    el.style.opacity = '';
                    el.classList.remove('dragging');
                    if (targetSlot) {
                        const task = tasks.find(t => t.id === dragData.taskId);
                        if (task) {
                            task.day = targetSlot.dataset.day;
                            document.getElementById('filterDate').value = '';
                            renderAll();
                        }
                    }
                    dragData = null;
                }, { passive: true });
                list.appendChild(div);
            });
        }

        function renderPlannerSlots() {
            const slots = document.querySelectorAll('.planner-slot');
            slots.forEach(slot => {
                const day = slot.dataset.day;
                const dayTasks = tasks.filter(t => t.day === day);
                if (dayTasks.length > 0) {
                    slot.classList.add('filled');
                    slot.innerHTML = '';
                    dayTasks.forEach(task => {
                        const taskDiv = document.createElement('div');
                        taskDiv.className = 'w-full text-left text-sm';
                        taskDiv.textContent = task.text;
                        const removeBtn = document.createElement('span');
                        removeBtn.className = 'remove-btn';
                        removeBtn.textContent = '×';
                        removeBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            task.day = null;
                            renderAll();
                        });
                        removeBtn.addEventListener('touchstart', (e) => {
                            e.stopPropagation();
                            task.day = null;
                            renderAll();
                        });
                        taskDiv.appendChild(removeBtn);
                        slot.appendChild(taskDiv);
                    });
                } else {
                    slot.classList.remove('filled');
                    slot.innerHTML = `<span class="text-gray-400 text-xs">Drop task here</span>`;
                }
                slot.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    slot.classList.add('drag-over');
                });
                slot.addEventListener('dragleave', () => {
                    slot.classList.remove('drag-over');
                });
                slot.addEventListener('drop', (e) => {
                    e.preventDefault();
                    slot.classList.remove('drag-over');
                    const taskId = parseInt(e.dataTransfer.getData('text/plain'));
                    const task = tasks.find(t => t.id === taskId);
                    if (task) {
                        task.day = slot.dataset.day;
                        document.getElementById('filterDate').value = '';
                        renderAll();
                    }
                });
            });
        }

        function updateTotals() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.day !== null).length;
            const pending = total - completed;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('pendingCount').textContent = pending;
        }

        document.getElementById('addTaskBtn').addEventListener('click', () => {
            const input = document.getElementById('newTaskInput');
            const text = input.value.trim();
            if (text === '') return;
            tasks.push({ id: Date.now(), text, completed: false, day: null });
            input.value = '';
            renderAll();
        });
        document.getElementById('newTaskInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('addTaskBtn').click();
        });
        document.getElementById('filterDate').addEventListener('change', renderAll);

        loadTasks();
    </script>
</body>
</html>
