<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pascalogix Structura | Atomic TODO Notebook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #ffffff; 
            color: #111111; 
            /* FIX 11: Added Inter and Roboto for better cross-platform rendering */
            font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; 
        }
        .red-accent { color: #d32f2f; }
        .bg-planner { background-color: #f9fafb; }

        .task-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 2px;
            padding: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 0.25rem;
            font-size: 0.8rem;
        }
        .task-card:hover {
            border-color: #111111;
            background: #f9fafb;
        }
        .task-card.selected {
            border: 2px solid #d32f2f;
            background: #fff5f5;
        }

        .planner-slot {
            background: #ffffff;
            border: 1px dashed #cbd5e1;
            border-radius: 2px;
            min-height: 60px;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0.5rem;
            color: #9ca3af;
            font-size: 0.75rem;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
        }
        .planner-slot:hover {
            border-color: #d32f2f;
            background: #fff5f5;
        }
        .planner-slot.filled {
            border: 1px solid #111111;
            background: #ffffff;
            color: #111111;
            justify-content: flex-start;
            text-align: left;
            cursor: default;
        }

        /* FIX 8: Standardized padding for better alignment */
        .notebook-entry {
            width: 100%;
            border-left: 3px solid #d32f2f;
            padding-left: 12px;
        }
        .task-title {
            font-weight: bold;
            margin-bottom: 0.25rem;
        }
        .atomic-section {
            background: #f1f5f9;
            padding: 0.25rem;
            border-radius: 2px;
            margin-top: 0.25rem;
            font-size: 0.7rem;
        }
        /* FIX 4: Increased font size from 0.6rem to 0.75rem */
        /* FIX 5: Changed color from red to black/gray to reduce visual overload */
        .atomic-label {
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.75rem;
            color: #111111;
            font-weight: bold;
            margin-bottom: 0.1rem;
        }
        /* FIX 9: Increased target size */
        .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            color: #d32f2f;
            cursor: pointer;
            font-size: 1.5rem;
            line-height: 1;
            padding: 0.4rem;
            background: #fff;
            border: 1px solid #d32f2f;
            border-radius: 2px;
        }
        .remove-btn:hover {
            background: #d32f2f;
            color: #fff;
        }

        .total-bar {
            background: #111111;
            color: #ffffff;
            padding: 0.75rem;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 0.5rem;
            display: flex;
            justify-content: space-around;
        }
        /* FIX 3: Fixed red on black to white on black for contrast */
        .total-bar .red-accent { color: #ffffff; }

        .col-header {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #111111;
            border-bottom: 2px solid #111111;
            padding-bottom: 0.25rem;
            margin-bottom: 0.5rem;
            font-weight: bold;
            text-align: center;
        }
        
        /* FIX 2: Shrunk and floated the date input to avoid giant gap */
        .date-input {
            font-size: 0.7rem;
            border: 1px solid #ccc;
            padding: 2px 4px;
            border-radius: 2px;
            margin-top: 4px;
            width: 45%;
            float: right;
            margin-left: 10px;
        }

        /* FIX 10: Darkened background for better contrast */
        .phase-detail {
            background: #e2e8f0;
            border: 1px solid #e5e7eb;
            padding: 1rem;
            margin-top: 1rem;
        }

        /* Static Plan Styles */
        /* FIX 6: Reduced header size and border thickness */
        .static-plan-header {
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            border-bottom: 2px solid #111111;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        .phase-block {
            border-left: 4px solid #d32f2f;
            padding-left: 1.5rem;
            margin-bottom: 2.5rem;
        }
        .phase-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- FIX 1: Responsive Emblem (Mobile 48px, Desktop 96px) -->
    <header class="shrink-0 border-b border-black py-3 bg-white z-10">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
               <img src="logo.png" alt="Pascalogix Insignia" class="logo">
